name: 📱 Mobile CI
on:
  push:
    paths: ['apps/mobile/**', '_toilets/**', '.github/workflows/mobile-ci.yml']
  pull_request:
    paths: ['apps/mobile/**', '_toilets/**']
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx expo lint
